name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  repository-projects: write
  # npm Trusted Publishing (OIDC) 需要此权限来申请 id-token
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: set pnpm
        uses: pnpm/action-setup@v4
        with:
          # OIDC 发布端支持从 pnpm 11 开始提供
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing 需要 Node >= 22.14 且内置 npm >= 11.5.1
          node-version: 22
          cache: 'pnpm'

      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prep commit message
        run: |
          echo "NEW_VERSION=$(pnpm changeset status --output=release.json && jq -r '.releases[0].newVersion' release.json && rm release.json)" >> "$GITHUB_ENV"

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: 'Release v${{env.NEW_VERSION}}'
          commit: 'Release v${{env.NEW_VERSION}}'
          publish: pnpm publish -r
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
